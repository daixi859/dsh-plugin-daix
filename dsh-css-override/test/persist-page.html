<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" /><title>persistence probe</title>
<style>body{margin:0;padding:14px;background:#eef1f6;font:12px/1.5 ui-monospace,Consolas,monospace}
#out{white-space:pre-wrap;background:#fff;border:1px solid #d8dee9;border-radius:10px;padding:12px}</style></head>
<body>
<div id="out">running…</div>
<script>
/* Platform module table (the GUI shell installs this before plugin bundles). */
window.__ModuleLoader__ = { __modules: {}, __last: undefined, load: function (e) { this.__modules[e.id] = e; this.__last = e; } };
/* Read-only React shim: enough to satisfy the plugin's client half. */
(function () {
  window.__React = {
    createElement: function (t) { return { type: t }; }, Fragment: '#',
    useState: function (v) { return [typeof v === 'function' ? v() : v, function () {}]; },
    useRef: function (v) { return { current: v }; },
    useMemo: function (f) { return f(); },
    useCallback: function (f) { return f; },
    useEffect: function () {}, useSyncExternalStore: function (s, g) { return g(); }
  };
})();
</script>
<script src="/client.js"></script>
<script>
(async function () {
  var out = document.getElementById('out');
  var lines = [];
  function say(s) { lines.push(s); out.textContent = lines.join('\n'); }
  try {
    /* Create the target BEFORE the plugin injects its sheet, so the sheet is
       genuinely later in document order (the case a user's rule must win). */
    var el = document.createElement('div');
    el.id = 'persist-target';
    el.setAttribute('style', 'outline: 1px solid rgb(1, 2, 3)');
    document.body.appendChild(el);

    var mod = window.__ModuleLoader__.__last.factory(function (id) { if (id === 'react') return window.__React; throw new Error(id); });
    mod.apply({
      get: function () { return undefined; },
      effect: function (fn) { fn(); return function () {}; },
      slots: { inject: function (s, cb) { cb(); }, register: function () { return function () {}; } }
    });
    var host = await (await fetch('/api/dsh-css-override/load')).json();
    await new Promise(function (r) { setTimeout(r, 900); });
    var tag = document.querySelector('style[data-plugin-css="dsh-css-override/rules"]');
    var enabled = (host.rules || []).filter(function (r) { return r.enabled === true; });
    say('host rules ......... ' + (host.rules || []).length + ' (enabled ' + enabled.length + '), revision ' + host.revision);
    say('stylesheets ........ ' + document.querySelectorAll('style[data-plugin-css="dsh-css-override/rules"]').length);
    say('last body child .... ' + (document.body.lastElementChild === tag ? 'IS the injected style' : String(document.body.lastElementChild && document.body.lastElementChild.tagName)));
    say('injects host css ... ' + (tag !== null && enabled.every(function (r) { return tag.textContent.indexOf(r.css.trim()) !== -1; })));
    say('injected css ....... ' + (tag === null ? '(none)' : JSON.stringify(tag.textContent.slice(0, 120))));
    /* The sheet is appended after this element was created, so a user rule with
       !important must beat the element's inline declaration here. */
    say('computed outline ... ' + getComputedStyle(el).outlineWidth + ' / ' + getComputedStyle(el).outlineColor);
    say('VERDICT ............ ' + (tag !== null && enabled.length > 0 && enabled.every(function (r) { return tag.textContent.indexOf(r.css.trim()) !== -1; }) ? 'PERSISTED-RULE-IS-LIVE' : 'NO-ENABLED-RULE-INJECTED'));
  } catch (error) {
    say('ERROR ' + (error && error.message ? error.message : error));
  }
})();
</script>
</body></html>
