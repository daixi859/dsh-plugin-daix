<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>便签 · 高保真设计稿</title>
<style>
/* ── 主题 token（沿用 DSH 的 --dsw-alias-* 命名，实机直接映射） ───────────── */
:root{
  --dsw-alias-bg-base:#f7f5f0;
  --dsw-alias-bg-layer:#fffdf9;
  --dsw-alias-bg-layer-hover:#f2eee6;
  --dsw-alias-bg-sunken:#efece5;
  --dsw-alias-label-primary:#211f1b;
  --dsw-alias-label-secondary:#6d6a62;
  --dsw-alias-label-tertiary:#9a968c;
  --dsw-alias-border-l1:#e7e3da;
  --dsw-alias-border-l2:#d6d1c5;
  --dsw-alias-brand-primary:#3f6d5a;
  --dsw-alias-brand-soft:#e8efe9;
  --dsw-alias-state-error:#b4453a;
  --dsw-alias-state-warn:#a8792a;
  --dsw-shadow-pop:0 18px 46px rgba(38,32,20,.16),0 2px 8px rgba(38,32,20,.07);
  --serif:"Iowan Old Style","Palatino Linotype","Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Cascadia Mono",monospace;
}
html[data-theme="dark"]{
  --dsw-alias-bg-base:#141413;
  --dsw-alias-bg-layer:#1c1b1a;
  --dsw-alias-bg-layer-hover:#262523;
  --dsw-alias-bg-sunken:#232220;
  --dsw-alias-label-primary:#ece9e2;
  --dsw-alias-label-secondary:#a09c92;
  --dsw-alias-label-tertiary:#75716a;
  --dsw-alias-border-l1:#302e2b;
  --dsw-alias-border-l2:#413e39;
  --dsw-alias-brand-primary:#7fb49a;
  --dsw-alias-brand-soft:#20302a;
  --dsw-alias-state-error:#e08074;
  --dsw-alias-state-warn:#d6a75c;
  --dsw-shadow-pop:0 20px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);
  font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--dsw-alias-brand-soft);color:var(--dsw-alias-label-primary)}

/* ── 布局骨架 ─────────────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}

/* 图标栏：sidebar.panellist 的位置 */
.rail{
  flex:none;width:52px;display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:12px 0;border-right:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-base);
}
.rail .mark{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin-bottom:10px;
  background:var(--dsw-alias-label-primary);color:var(--dsw-alias-bg-layer);
  font:600 13px/1 var(--serif);
}
.rail-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--dsw-alias-label-tertiary);position:relative;transition:background .14s,color .14s;
}
.rail-btn:hover{background:var(--dsw-alias-bg-layer-hover);color:var(--dsw-alias-label-secondary)}
.rail-btn[aria-current="true"]{color:var(--dsw-alias-brand-primary);background:var(--dsw-alias-brand-soft)}
.rail-btn svg{width:17px;height:17px;display:block}
.rail-btn .cnt{
  position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;border-radius:7px;
  background:var(--dsw-alias-brand-primary);color:var(--dsw-alias-bg-layer);
  font:600 9px/14px var(--sans);text-align:center;
}
.rail .sp{flex:1}

/* 侧栏 */
.sidebar{
  flex:none;width:256px;display:flex;flex-direction:column;
  border-right:1px solid var(--dsw-alias-border-l1);background:var(--dsw-alias-bg-base);
}
.sb-head{padding:14px 14px 8px;display:flex;align-items:center;gap:8px}
.sb-title{font:600 13px/1.2 var(--sans);letter-spacing:.01em}
.sb-new{
  margin:2px 12px 10px;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:7px;
  border:1px solid var(--dsw-alias-border-l1);color:var(--dsw-alias-label-secondary);font-size:12.5px;
}
.sb-new:hover{background:var(--dsw-alias-bg-layer-hover)}
.sb-scroll{flex:1;overflow:auto;padding:0 8px 12px}
.ws{margin-top:10px}
.ws-h{
  display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;
  color:var(--dsw-alias-label-tertiary);font:500 11px/1.4 var(--sans);letter-spacing:.04em;
  text-transform:none;
}
.ws-h:hover{background:var(--dsw-alias-bg-layer-hover)}
.sess{
  display:flex;align-items:baseline;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;
  color:var(--dsw-alias-label-secondary);font-size:12.5px;
}
.sess:hover{background:var(--dsw-alias-bg-layer-hover);color:var(--dsw-alias-label-primary)}
.sess[aria-current="true"]{background:var(--dsw-alias-bg-layer-hover);color:var(--dsw-alias-label-primary);font-weight:500}
.sess .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .tm{font-size:10.5px;color:var(--dsw-alias-label-tertiary);flex:none}
.sb-foot{border-top:1px solid var(--dsw-alias-border-l1);padding:8px}
.sb-foot .sess{font-size:12.5px}

/* 主列 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--dsw-alias-bg-base)}
.m-head{
  flex:none;height:48px;display:flex;align-items:center;gap:10px;padding:0 18px;
  border-bottom:1px solid var(--dsw-alias-border-l1);
}
.m-head .crumb{font-size:12.5px;color:var(--dsw-alias-label-tertiary)}
.m-head .ttl{font:600 13px/1.3 var(--sans)}
.m-head .sp{flex:1}
.icon-btn{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--dsw-alias-label-secondary);
}
.icon-btn:hover{background:var(--dsw-alias-bg-layer-hover);color:var(--dsw-alias-label-primary)}
.icon-btn svg{width:15px;height:15px;display:block}

/* ── 对话视图 ─────────────────────────────────────────────────────────────── */
.conv{flex:1;overflow:auto;padding:26px 0 8px}
.conv-in{max-width:760px;margin:0 auto;padding:0 28px}
.msg{margin-bottom:26px}
.msg.user{margin-bottom:22px}
.msg.user .bubble{
  background:var(--dsw-alias-bg-sunken);border:1px solid var(--dsw-alias-border-l1);
  border-radius:10px;padding:10px 13px;font-size:13.5px;
  width:fit-content;max-width:100%;white-space:pre-wrap;
}
.role{
  font:500 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--dsw-alias-label-tertiary);margin-bottom:8px;
}
.md{font-size:14px;line-height:1.68}
.md > :first-child{margin-top:0}
.md > :last-child{margin-bottom:0}
.md p{margin:0 0 .85em}
.md h1,.md h2,.md h3,.md h4{font-family:var(--serif);font-weight:600;letter-spacing:.005em;margin:1.3em 0 .5em;line-height:1.32}
.md h1{font-size:20px}.md h2{font-size:17.5px}.md h3{font-size:15.5px}.md h4{font-size:14px}
.md code{
  font-family:var(--mono);font-size:.86em;background:var(--dsw-alias-bg-sunken);
  border:1px solid var(--dsw-alias-border-l1);border-radius:5px;padding:.1em .34em;
}
.md pre{
  margin:0 0 .9em;padding:11px 13px;border-radius:9px;overflow:auto;
  background:var(--dsw-alias-bg-sunken);border:1px solid var(--dsw-alias-border-l1);
}
.md pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.6}
.md blockquote{
  margin:0 0 .9em;padding:2px 0 2px 13px;border-left:2px solid var(--dsw-alias-border-l2);
  color:var(--dsw-alias-label-secondary);
}
.md ul,.md ol{margin:0 0 .9em;padding-left:1.35em}
.md li{margin:.22em 0}
.md hr{border:none;border-top:1px solid var(--dsw-alias-border-l1);margin:1.3em 0}
.md a{color:var(--dsw-alias-brand-primary);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--dsw-alias-brand-primary) 40%,transparent)}
.md strong{font-weight:650}
.md del{color:var(--dsw-alias-label-tertiary)}

/* 回答下方的操作行（conversation.chat.assistant-actions） */
.actions{display:flex;align-items:center;gap:2px;margin-top:9px;margin-left:-5px}
.act{
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
  color:var(--dsw-alias-label-tertiary);transition:color .13s,background .13s;
}
.act:hover{background:var(--dsw-alias-bg-layer-hover);color:var(--dsw-alias-label-primary)}
.act svg{width:14px;height:14px;display:block}
.act[aria-pressed="true"]{color:var(--dsw-alias-brand-primary)}
.act[aria-pressed="true"]:hover{background:var(--dsw-alias-brand-soft)}

/* 输入框 */
.composer{flex:none;padding:10px 0 16px}
.composer-in{max-width:760px;margin:0 auto;padding:0 28px}
.card{
  border:1px solid var(--dsw-alias-border-l2);border-radius:12px;background:var(--dsw-alias-bg-layer);
  box-shadow:0 1px 2px rgba(38,32,20,.04);padding:10px 12px 8px;
}
.card textarea{
  width:100%;border:none;outline:none;resize:none;background:none;color:inherit;
  font:13.5px/1.6 var(--sans);min-height:44px;display:block;
}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:4px}
.card-foot .sp{flex:1}
.send{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:var(--dsw-alias-brand-primary);color:var(--dsw-alias-bg-layer);
}
.send svg{width:15px;height:15px}

/* ── 便签详情页（main keyed slot） ────────────────────────────────────────── */
.notes{flex:1;overflow:auto}
.notes-in{max-width:840px;margin:0 auto;padding:20px 32px 80px}
.n-head{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
.n-title{font:600 23px/1.2 var(--serif);letter-spacing:.01em}
.n-count{font:400 12.5px/1 var(--sans);color:var(--dsw-alias-label-tertiary)}
.n-sub{
  margin:4px 0 12px;font-size:12px;color:var(--dsw-alias-label-secondary);
}
.tools{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.search{
  flex:1;display:flex;align-items:center;gap:7px;padding:0 10px;height:32px;border-radius:8px;
  border:1px solid var(--dsw-alias-border-l1);background:var(--dsw-alias-bg-layer);
}
.search svg{width:14px;height:14px;color:var(--dsw-alias-label-tertiary);flex:none}
.search input{flex:1;border:none;outline:none;background:none;font:13px var(--sans);color:inherit;min-width:0}
.seg{display:flex;border:1px solid var(--dsw-alias-border-l1);border-radius:8px;overflow:hidden;flex:none}
.seg button{padding:0 11px;height:30px;font-size:12.5px;color:var(--dsw-alias-label-secondary)}
.seg button[aria-pressed="true"]{background:var(--dsw-alias-bg-sunken);color:var(--dsw-alias-label-primary);font-weight:500}

.group{margin-bottom:14px}
.group-h{
  display:flex;align-items:baseline;gap:9px;padding-bottom:5px;margin-bottom:1px;
  border-bottom:1px solid var(--dsw-alias-border-l2);
}
.group-h .g-t{font:600 12px/1.3 var(--sans);letter-spacing:.055em;color:var(--dsw-alias-label-secondary)}
.group-h .g-n{font-size:11px;color:var(--dsw-alias-label-tertiary)}
.group-h .sp{flex:1}

/* 便签卡片 */
.n-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.note{
  display:flex;flex-direction:column;gap:0;
  border:1px solid var(--dsw-alias-border-l1);border-radius:10px;
  background:var(--dsw-alias-bg-layer);
  padding:11px 12px 8px;transition:border-color .14s,box-shadow .14s;
}
.note:hover{border-color:var(--dsw-alias-border-l2);box-shadow:0 2px 10px rgba(38,32,20,.06)}
html[data-theme="dark"] .note:hover{box-shadow:0 2px 12px rgba(0,0,0,.3)}
/* 便签只有正文，没有标题：预览直接取正文前几行 */
.n-note-x{
  margin:0;font-size:12.5px;line-height:1.6;color:var(--dsw-alias-label-primary);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  white-space:pre-wrap;flex:1;
}
.n-foot{
  display:flex;align-items:center;gap:4px;margin-top:9px;padding-top:6px;
  border-top:1px solid var(--dsw-alias-border-l1);
}
.n-src{
  flex:1;min-width:0;font-size:10.5px;color:var(--dsw-alias-label-tertiary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.n-acts{display:flex;gap:1px;flex:none}
.n-acts .act{width:26px;height:26px}
.n-acts .act svg{width:14px;height:14px}
.n-acts .act.danger:hover{color:var(--dsw-alias-state-error)}

/* 内联编辑 */
.n-edit{flex:1;min-width:0}
.note.is-editing{border-color:var(--dsw-alias-brand-primary)}
.n-edit textarea{
  width:100%;min-height:96px;border:1px solid var(--dsw-alias-border-l2);border-radius:8px;
  padding:9px 11px;font:12.5px/1.62 var(--mono);color:inherit;background:var(--dsw-alias-bg-layer);
  outline:none;resize:vertical;
}
.n-edit textarea:focus{border-color:var(--dsw-alias-brand-primary)}
.n-edit .row{display:flex;gap:8px;justify-content:flex-end;margin-top:7px}
.btn{
  padding:5px 13px;border-radius:7px;border:1px solid var(--dsw-alias-border-l2);
  font-size:12.5px;color:var(--dsw-alias-label-primary);
}
.btn:hover{background:var(--dsw-alias-bg-layer-hover)}
.btn.primary{background:var(--dsw-alias-brand-primary);border-color:transparent;color:var(--dsw-alias-bg-layer)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;color:var(--dsw-alias-label-secondary)}

.empty{
  padding:56px 0;text-align:center;color:var(--dsw-alias-label-tertiary);
}
.empty .e-t{font:600 15px/1.4 var(--serif);color:var(--dsw-alias-label-secondary);margin-bottom:5px}
.empty .e-d{font-size:12.5px}

/* ── hover 浮层（向左栏图标右侧展开） ────────────────────────────────────── */
.hovercard{
  position:fixed;z-index:60;width:352px;max-height:min(62vh,520px);
  display:flex;flex-direction:column;
  background:var(--dsw-alias-bg-layer);border:1px solid var(--dsw-alias-border-l2);
  border-radius:13px;box-shadow:var(--dsw-shadow-pop);
  opacity:0;transform:translateX(-6px) scale(.985);transform-origin:left top;
  transition:opacity .13s ease-out,transform .13s ease-out;
  pointer-events:none;
}
.hovercard[data-open="true"]{opacity:1;transform:none;pointer-events:auto}
@starting-style{.hovercard[data-open="true"]{opacity:0;transform:translateX(-6px) scale(.985)}}
@media (prefers-reduced-motion:reduce){
  .hovercard{transition:none}
}
.hc-head{
  padding:11px 13px 9px;border-bottom:1px solid var(--dsw-alias-border-l1);
  display:flex;align-items:baseline;gap:8px;flex:none;
}
.hc-h{font:600 12.5px/1.3 var(--sans);letter-spacing:.03em}
.hc-ws{
  font-size:11px;color:var(--dsw-alias-label-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hc-scroll{overflow:auto;padding:5px 6px 6px}
.hc-row{
  display:flex;align-items:flex-start;gap:9px;padding:8px 8px;border-radius:8px;cursor:default;
}
.hc-row:hover{background:var(--dsw-alias-bg-layer-hover)}
.hc-row .hc-main{flex:1;min-width:0}
.hc-row .hc-t{
  font-size:12.5px;line-height:1.5;color:var(--dsw-alias-label-primary);margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;
}
.hc-row .hc-m{
  font-size:11px;color:var(--dsw-alias-label-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hc-send{
  flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
  color:var(--dsw-alias-label-tertiary);opacity:0;transition:opacity .12s,color .12s,background .12s;
}
.hc-row:hover .hc-send,.hc-send:focus-visible{opacity:1}
.hc-send:hover{background:var(--dsw-alias-brand-soft);color:var(--dsw-alias-brand-primary)}
.hc-send svg{width:14px;height:14px}
.hc-foot{
  flex:none;border-top:1px solid var(--dsw-alias-border-l1);padding:7px 8px;
  display:flex;align-items:center;gap:6px;
}
.hc-all{
  width:100%;padding:6px 8px;border-radius:7px;display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--dsw-alias-label-secondary);
}
.hc-all:hover{background:var(--dsw-alias-bg-layer-hover);color:var(--dsw-alias-label-primary)}
.hc-all kbd{
  font:500 10.5px/1 var(--sans);color:var(--dsw-alias-label-tertiary);
  border:1px solid var(--dsw-alias-border-l1);border-radius:4px;padding:2px 4px;
}
.hc-empty{padding:22px 12px;text-align:center;font-size:12px;color:var(--dsw-alias-label-tertiary)}

/* ── 设置弹层 ─────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(24,20,12,.34);z-index:70;display:none}
.scrim[data-open="true"]{display:block}
.sheet{
  position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(680px,calc(100vw - 40px));background:var(--dsw-alias-bg-layer);
  border:1px solid var(--dsw-alias-border-l2);border-radius:14px;box-shadow:var(--dsw-shadow-pop);
  padding:16px 18px 14px;display:none;
}
.sheet[data-open="true"]{display:block}
.sheet-body{display:grid;grid-template-columns:1fr 208px;gap:20px;align-items:start}
.sheet h3{font:600 15px/1.3 var(--serif);margin:0 0 3px}
.sheet .s-sub{font-size:12px;color:var(--dsw-alias-label-tertiary);margin:0 0 10px}
/* 设置页的实时预览：把便签卡与浮层行摆出来，改动立刻可见 */
.sheet-preview{
  border-left:1px solid var(--dsw-alias-border-l1);padding-left:18px;
}
.pv-label{
  font:500 10px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--dsw-alias-label-tertiary);margin-bottom:9px;
}
.pv-card{
  border:1px solid var(--dsw-alias-border-l1);border-radius:9px;background:var(--dsw-alias-bg-layer);
  padding:8px 9px;font-size:11px;line-height:1.55;color:var(--dsw-alias-label-primary);
}
.pv-card .pv-x{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;white-space:pre-wrap;
  color:var(--dsw-alias-label-primary);height:calc(1.45em * 4);
}
.pv-card .pv-foot{
  display:flex;align-items:center;gap:3px;margin-top:7px;padding-top:5px;
  border-top:1px solid var(--dsw-alias-border-l1);
}
.pv-card .pv-src{flex:1;font-size:9.5px;color:var(--dsw-alias-label-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-card .pv-acts{display:flex;gap:0;color:var(--dsw-alias-label-tertiary)}
.pv-card .pv-acts svg{width:11px;height:11px;display:block;margin-left:4px}
.pv-hover{
  margin-top:10px;border:1px solid var(--dsw-alias-border-l2);border-radius:9px;
  background:var(--dsw-alias-bg-layer);box-shadow:0 6px 18px rgba(38,32,20,.10);
  overflow:hidden;
}
.pv-hover .pv-h{
  padding:6px 8px;border-bottom:1px solid var(--dsw-alias-border-l1);
  font-size:9.5px;color:var(--dsw-alias-label-tertiary);
  display:flex;justify-content:space-between;gap:6px;
}
.pv-hover .pv-r{
  padding:5px 8px;font-size:10.5px;line-height:1.45;color:var(--dsw-alias-label-secondary);
  border-bottom:1px solid var(--dsw-alias-border-l1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pv-hover .pv-r:last-child{border-bottom:none}
.pv-hint{margin-top:8px;font-size:10px;line-height:1.5;color:var(--dsw-alias-label-tertiary)}
.srow{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--dsw-alias-border-l1)}
.srow .s-l{flex:1;min-width:0}
.srow .s-n{font-size:13px}

/* 内容哈希去重（Q22：按正文内容哈希，而不是 messageId） */
function hash(text) {
  let h = 2166136261;
  const s = text.replace(/\s+/g, ' ').trim().toLowerCase();
  for (let i = 0; i < s.length; i += 1) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}
for (const n of state.notes) state.savedHashes.add(hash(n.text));

/* ── 迷你 Markdown 渲染（仅 mock 用；实机沿用 DSH 的渲染层） ─────────────── */
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
  return t;
}
function renderMd(src) {
  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const closeList = (tag) => { if (tag) out.push(`</${tag}>`); };
  let list = null;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      closeList(list); list = null;
      const lang = line.slice(3).trim();
      i += 1;
      const body = [];
      while (i < lines.length && !/^```/.test(lines[i])) { body.push(lines[i]); i += 1; }
      i += 1;
      out.push(`<pre data-lang="${esc(lang)}"><code>${esc(body.join('\n'))}</code></pre>`);
      continue;
    }
    if (/^\s*$/.test(line)) { closeList(list); list = null; i += 1; continue; }
    if (/^#{1,4}\s+/.test(line)) {
      closeList(list); list = null;
      const m = /^(#{1,4})\s+(.*)$/.exec(line);
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
      i += 1; continue;
    }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { closeList(list); list = null; out.push('<hr>'); i += 1; continue; }
    if (/^>\s?/.test(line)) {
      closeList(list); list = null;
      const body = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { body.push(lines[i].replace(/^>\s?/, '')); i += 1; }
      out.push(`<blockquote>${body.map(inline).join('<br>')}</blockquote>`);
      continue;
    }
    const ul = /^\s*[-*+]\s+/.test(line);
    const ol = /^\s*\d+[.)]\s+/.test(line);
    if (ul || ol) {
      const tag = ul ? 'ul' : 'ol';
      if (list !== tag) { closeList(list); out.push(`<${tag}>`); list = tag; }
      out.push(`<li>${inline(line.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, ''))}</li>`);
      i += 1; continue;
    }
    closeList(list); list = null;
    const para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|```|>|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i])) {
      para.push(lines[i]); i += 1;
    }
    out.push(`<p>${para.map(inline).join('<br>')}</p>`);
  }
  closeList(list);
  return out.join('\n');
}

/* 纯文本化（列表标题、摘要用） */
function plain(text) {
  return text
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/^\s*\d+[.)]\s+/gm, '')
    .replace(/^>\s?/gm, '')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/\*\*([^*]*)\*\*/g, '$1')
    .replace(/\*([^*]*)\*/g, '$1')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/~~([^~]*)~~/g, '$1')
    .replace(/[ \t]+/g, ' ')
    .trim();
}
function noteExcerpt(note) {
  const p = plain(note.text).split('\n').map((s) => s.trim()).filter(Boolean);
  const joined = p.join(' ');
  return joined.length > 150 ? joined.slice(0, 150) + '…' : joined;
}
function relTime(at) {
  const d = Date.now() - at;
  if (d < 60e3) return '刚刚';
  if (d < 3600e3) return `${Math.floor(d / 60e3)} 分钟前`;
  if (d < 86400e3) return `${Math.floor(d / 3600e3)} 小时前`;
  if (d < 7 * 86400e3) return `${Math.floor(d / 86400e3)} 天前`;
  return new Date(at).toLocaleDateString('zh-CN');
}

/* ── 侧栏 ─────────────────────────────────────────────────────────────────── */
function renderSidebar() {

      <span class="ttl">便签插件设计</span>
      <span class="sp"></span>
      <button class="icon-btn" aria-label="更多">${ICON.gear}</button>
    </div>
    <div class="conv"><div class="conv-in">
      <div class="msg user"><div class="role">你</div>
        <div class="bubble">我想开发一个便签插件，用于记录提示词回答。每轮回答下方提供图标，点击可收藏。</div>
      </div>
      ${ANSWERS.map((a, idx) => `
        <div class="msg" data-answer="${idx}">
          <div class="role">DeepSeek</div>
          <div class="md">${renderMd(a.md)}</div>
          <div class="actions">
            <button class="act" aria-label="复制">${ICON.copy}</button>
            <button class="act act-save" data-answer="${idx}" aria-label="收藏为便签" aria-pressed="false" title="收藏为便签">${ICON.bookmark(false)}</button>
            <button class="act" aria-label="分支">${ICON.branch}</button>
          </div>
        </div>`).join('')}
    </div></div>
    <div class="composer"><div class="composer-in"><div class="card">
      <textarea id="draft" rows="2" placeholder="给代理发消息…">继续设计详情页。</textarea>
      <div class="card-foot"><span class="sp"></span>
        <button class="send" aria-label="发送">${ICON.send}</button>
      </div>
    </div></div></div>`;

  // 已收藏状态回填（按内容哈希）
  for (const btn of main.querySelectorAll('.act-save')) {
    const answer = ANSWERS[Number(btn.dataset.answer)];
    const saved = state.savedHashes.has(hash(answer.md));
    btn.setAttribute('aria-pressed', String(saved));
    btn.innerHTML = ICON.bookmark(saved);
    btn.setAttribute('aria-label', saved ? '取消收藏' : '收藏为便签');
  }
  for (const btn of main.querySelectorAll('.act-save')) {
    btn.addEventListener('click', () => toggleSave(Number(btn.dataset.answer)));
  }
}

function toggleSave(index) {
  const answer = ANSWERS[index];
  const h = hash(answer.md);
  if (state.savedHashes.has(h)) {
    const id = state.notes.find((n) => hash(n.text) === h).id;
    state.notes = state.notes.filter((n) => n.id !== id);
    state.savedHashes.delete(h);
    toast('已从便签移除', { label: '撤销', run: () => {
      state.notes.push({ id, ws: currentWs(), session: CURRENT_SESSION, at: Date.now(), text: answer.md });
      state.savedHashes.add(h); refresh();
    }});
  } else {
    state.notes.unshift({ id: 'n' + Math.random().toString(36).slice(2, 8), ws: currentWs(), session: CURRENT_SESSION, at: Date.now(), text: answer.md });
    state.savedHashes.add(h);
    toast('已收藏到便签');
  }
  refresh();
}

/* ── 便签详情页 ───────────────────────────────────────────────────────────── */
function filteredNotes() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.notes;
  return state.notes.filter((n) => plain(n.text).toLowerCase().includes(q));
}
function renderNotes() {
  const main = document.getElementById('main');
  const all = [...filteredNotes()].sort((a, b) => b.at - a.at);
  const total = state.notes.length;

  const rowsHtml = (items) => items.map((n) => {
    if (state.editing === n.id) {
      return `<div class="note is-editing" data-note="${n.id}">
        <div class="n-edit">
          <textarea data-edit="${n.id}" spellcheck="false">${esc(n.text)}</textarea>
          <div class="row">
            <button class="btn ghost" data-act="cancel" data-note="${n.id}">取消</button>
            <button class="btn primary" data-act="save" data-note="${n.id}">保存</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="note" data-note="${n.id}">
      <p class="n-note-x">${esc(noteExcerpt(n))}</p>
      <div class="n-foot">
        <span class="n-src">${esc(sessTitle(n.session))}</span>
        <div class="n-acts">
          <button class="act" data-act="send" data-note="${n.id}" aria-label="发送到输入框" title="发送到输入框">${ICON.send}</button>
          <button class="act" data-act="edit" data-note="${n.id}" aria-label="编辑" title="编辑">${ICON.pencil}</button>
          <button class="act danger" data-act="del" data-note="${n.id}" aria-label="删除" title="删除">${ICON.trash}</button>
        </div>
      </div>
    </div>`;
  }).join('');

  let body = '';
  if (all.length === 0) {
    body = `<div class="empty"><div class="e-t">${state.query ? '没有匹配的便签' : '还没有便签'}</div>
      <div class="e-d">${state.query ? '换个关键词试试' : '在任意一条回答下方点击书签图标即可收藏'}</div></div>`;
  } else if (state.view === 'flat' || state.query) {
    body = `<div class="group"><div class="group-h"><span class="g-t">全部</span><span class="g-n">${all.length}</span><span class="sp"></span></div><div class="n-grid">${rowsHtml(all)}</div></div>`;
  } else {
    const groups = new Map();
    for (const n of all) {
      if (!groups.has(n.ws)) groups.set(n.ws, []);
      groups.get(n.ws).push(n);
    }
    body = [...groups.entries()].map(([ws, items]) => `
      <div class="group">
        <div class="group-h"><span class="g-t">${esc(wsTitle(ws))}</span><span class="g-n">${items.length}</span><span class="sp"></span></div>
        <div class="n-grid">${rowsHtml(items)}</div>
      </div>`).join('');
  }

  main.innerHTML = `
    <div class="m-head">
      <span class="crumb">插件</span><span class="ttl">便签</span>
      <span class="sp"></span>
      <button class="icon-btn" id="hdr-notes" aria-label="便签气泡" title="便签气泡（点击展开）">${ICON.note}</button>
      <button class="icon-btn" id="open-settings" aria-label="便签设置" title="便签设置">${ICON.gear}</button>
    </div>
    <div class="notes"><div class="notes-in">
      <div class="n-head"><h1 class="n-title">便签</h1><span class="n-count">${total} 条</span></div>
      <p class="n-sub">收藏自各轮回答的 Markdown 片段。点击发送即追加到当前会话的输入框。</p>
      <div class="tools">
        <label class="search">${ICON.search}
          <input id="q" type="search" placeholder="搜索便签正文…" value="${esc(state.query)}" />
        </label>
        <div class="seg" role="group" aria-label="排列方式">
          <button data-view="grouped" aria-pressed="${state.view === 'grouped'}">按工作区</button>
          <button data-view="flat" aria-pressed="${state.view === 'flat'}">全部</button>
        </div>
      </div>
      ${body}
    </div></div>`;

  applyEntryPositions();
  main.querySelector('#q').addEventListener('input', (e) => {
    state.query = e.target.value;
    const pos = e.target.selectionStart;
    renderNotes();
    const q = document.getElementById('q');
    q.focus(); q.setSelectionRange(pos, pos);
  });
  for (const b of main.querySelectorAll('[data-view]')) {
    b.addEventListener('click', () => { state.view = b.dataset.view; renderNotes(); });
  }
  main.querySelector('#open-settings').addEventListener('click', openSheet);
  main.querySelector('#hdr-notes').addEventListener('click', (event) => {
    event.stopPropagation();
    if (hoverEl.dataset.open === 'true' && hoverEl.dataset.placement === 'header') hideHover();
    else showHover(main.querySelector('#hdr-notes'));
  });
  for (const b of main.querySelectorAll('[data-act]')) {
    b.addEventListener('click', () => {
      const id = b.dataset.note;
      const act = b.dataset.act;
      if (act === 'send') sendToDraft(id);
      else if (act === 'edit') { state.editing = id; renderNotes(); }
      else if (act === 'cancel') { state.editing = null; renderNotes(); }
      else if (act === 'save') {
        const ta = main.querySelector(`[data-edit="${id}"]`);
        const note = state.notes.find((n) => n.id === id);
        state.savedHashes.delete(hash(note.text));
        note.text = ta.value;
        state.savedHashes.add(hash(note.text));
        state.editing = null;
        toast('便签已更新');
        renderNotes();
      } else if (act === 'del') deleteNote(id);
    });
  }
}

function deleteNote(id) {
  const idx = state.notes.findIndex((n) => n.id === id);
  if (idx < 0) return;
  const [removed] = state.notes.splice(idx, 1);
  state.savedHashes.delete(hash(removed.text));
  refresh();
  toast('便签已删除', { label: '撤销', run: () => {
    state.notes.splice(idx, 0, removed);
    state.savedHashes.add(hash(removed.text));
    refresh();
  }});
}

function sendToDraft(id) {
  const note = state.notes.find((n) => n.id === id);
  if (!note) return;
  state.main = 'conversation';
  render();
  const draft = document.getElementById('draft');
  const prev = draft.value.trimEnd();
  draft.value = prev ? `${prev}\n\n${note.text}` : note.text;
  draft.focus();
  draft.setSelectionRange(draft.value.length, draft.value.length);
  toast('已追加到输入框');
}

/* ── hover 浮层 ───────────────────────────────────────────────────────────── */
function renderHover() {
  const ws = currentWs();
  const inWs = state.notes.filter((n) => n.ws === ws);
  const list = (inWs.length ? inWs : state.notes)
    .slice()
    .sort((a, b) => b.at - a.at)
    .slice(0, state.hoverCount);
  const fallback = inWs.length === 0;
  document.getElementById('hc-ws').textContent = fallback
    ? `全部便签（${wsTitle(ws)} 暂无）`
    : `${wsTitle(ws)} · ${inWs.length} 条`;

  const host = document.getElementById('hc-list');
  if (list.length === 0) {
    host.innerHTML = `<div class="hc-empty">还没有便签。在回答下方点书签图标收藏。</div>`;
    return;
  }
  host.innerHTML = list.map((n) => `
    <div class="hc-row" data-note="${n.id}">
      <div class="hc-main">
        <p class="hc-t">${esc(noteExcerpt(n))}</p>
        <div class="hc-m">${esc(sessTitle(n.session))} · ${relTime(n.at)}</div>
      </div>
      <button class="hc-send" data-hc-send="${n.id}" aria-label="发送到输入框" title="发送到输入框">${ICON.send}</button>
    </div>`).join('');
  for (const b of host.querySelectorAll('[data-hc-send]')) {
    b.addEventListener('click', (e) => { e.stopPropagation(); hideHover(); sendToDraft(b.dataset.hcSend); });
  }
}

const hoverEl = document.getElementById('note-hover');
const railNotes = document.getElementById('rail-notes');
let hoverTimer = null;
let hideTimer = null;

function showHover(anchor) {
  // 左栏浮层受 hoverEnabled 控制；标题栏气泡是点击触发，不受它影响。
  if (!anchor && !state.hoverEnabled) return;
  renderHover();
  const r = (anchor || railNotes).getBoundingClientRect();
  let top;
  let left;
  if (anchor) {
    // 标题栏按钮在右上角：向左下展开，右缘不越过按钮与视口。
    top = r.bottom + 8;
    left = Math.max(8, Math.min(r.right - 352, window.innerWidth - 360));
    hoverEl.dataset.placement = 'header';
  } else {
    top = Math.min(r.top + 2, window.innerHeight - 180);
    left = r.right + 10;
    hoverEl.dataset.placement = 'sidebar';
  }
  hoverEl.style.top = Math.max(8, top) + 'px';
  hoverEl.style.left = left + 'px';
  hoverEl.dataset.open = 'true';
  (anchor || railNotes).setAttribute('aria-expanded', 'true');
}
function hideHover() {
  hoverEl.dataset.open = 'false';
  railNotes.setAttribute('aria-expanded', 'false');
  const hdr = document.getElementById('hdr-notes');
  if (hdr) hdr.setAttribute('aria-expanded', 'false');
}
// 点击外部关闭（捕获阶段），面板与两个触发按钮都算内部。
document.addEventListener('pointerdown', (event) => {
  if (hoverEl.dataset.open !== 'true') return;
  const hdr = document.getElementById('hdr-notes');
  if (hoverEl.contains(event.target) || railNotes.contains(event.target) || (hdr && hdr.contains(event.target))) return;
  hideHover();
}, true);
railNotes.addEventListener('pointerenter', () => {
  clearTimeout(hideTimer);
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(showHover, 260);
});
railNotes.addEventListener('pointerleave', () => {
  clearTimeout(hoverTimer);
  hideTimer = setTimeout(hideHover, 320);
});
railNotes.addEventListener('focus', showHover);
railNotes.addEventListener('blur', () => {
  if (!hoverEl.dataset.open) return;
  hideTimer = setTimeout(hideHover, 200);
});
hoverEl.addEventListener('pointerenter', () => clearTimeout(hideTimer));
hoverEl.addEventListener('pointerleave', () => { hideTimer = setTimeout(hideHover, 260); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hideHover(); closeSheet(); } });

railNotes.addEventListener('click', () => {
  hideHover();
  state.main = 'notes';
  render();
});
document.getElementById('hc-all').addEventListener('click', () => {
  hideHover();
  state.main = 'notes';
  render();
});

/* ── 设置弹层 ─────────────────────────────────────────────────────────────── */
const scrim = document.getElementById('scrim');
const sheet = document.getElementById('sheet');

function renderSheetPreview() {
  const sample = state.notes[0];
  const card = document.getElementById('pv-card');
  card.innerHTML = sample ? `
    <div class="pv-x">${esc(noteExcerpt(sample))}</div>
    <div class="pv-foot">
      <span class="pv-src">${esc(sessTitle(sample.session))}</span>
      <span class="pv-acts">${ICON.send}${ICON.pencil}${ICON.trash}</span>
    </div>` : `<div class="pv-x">暂无便签</div>`;

  const rows = Math.max(1, Math.min(4, state.hoverCount));
  const sampleRows = state.notes.slice(0, rows);
  const hoverEl = document.getElementById('pv-hover');
  hoverEl.innerHTML = `
    <div class="pv-h"><span>当前工作区</span><span>${state.hoverEnabled ? 'hover 弹出' : '已关闭'}</span></div>
    ${sampleRows.map((n) => `<div class="pv-r">${esc(noteExcerpt(n).slice(0, 20))}…</div>`).join('')}
    ${state.hoverCount > 4 ? `<div class="pv-r">…共 ${state.hoverCount} 条</div>` : ''}`;
  hoverEl.style.opacity = state.hoverEnabled ? '1' : '.42';

  document.getElementById('pv-hint').textContent = state.hoverEnabled
    ? `侧栏图标 hover 时向右弹出，最多 ${state.hoverCount} 条`
    : '悬浮框已关闭，点击侧栏图标直接进入详情页';
}

function openSheet() {
  document.getElementById('set-count').value = state.hoverCount;
  document.getElementById('set-hover').setAttribute('aria-checked', String(state.hoverEnabled));
  document.getElementById('set-sidebar').setAttribute('aria-checked', String(state.entryPositions.includes('sidebar')));
  document.getElementById('set-header').setAttribute('aria-checked', String(state.entryPositions.includes('header')));
  document.getElementById('set-view').value = state.view;
  renderSheetPreview();
  scrim.dataset.open = 'true';
  sheet.dataset.open = 'true';
}
function closeSheet() {
  scrim.dataset.open = 'false';
  sheet.dataset.open = 'false';
}
document.getElementById('sheet-close').addEventListener('click', closeSheet);
scrim.addEventListener('click', closeSheet);
document.getElementById('set-count').addEventListener('input', (e) => {
  const v = Math.min(30, Math.max(3, Number(e.target.value) || 10));
  state.hoverCount = v;
  renderSheetPreview();
});
function toggleEntryPosition(position, button) {
  const on = !state.entryPositions.includes(position);
  state.entryPositions = ['sidebar', 'header'].filter((item) => item === position ? on : state.entryPositions.includes(item));
  button.setAttribute('aria-checked', String(on));
  applyEntryPositions();
}
document.getElementById('set-sidebar').addEventListener('click', (e) => toggleEntryPosition('sidebar', e.currentTarget));
document.getElementById('set-header').addEventListener('click', (e) => toggleEntryPosition('header', e.currentTarget));

document.getElementById('set-hover').addEventListener('click', (e) => {
  state.hoverEnabled = !state.hoverEnabled;
  e.currentTarget.setAttribute('aria-checked', String(state.hoverEnabled));
  renderSheetPreview();
});
document.getElementById('set-view').addEventListener('change', (e) => {
  state.view = e.target.value;
  if (state.main === 'notes') renderNotes();
});

/* ── Toast ────────────────────────────────────────────────────────────────── */
function toast(text, action) {
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(text)}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.addEventListener('click', () => { action.run(); el.remove(); });
    el.appendChild(b);
  }
  const x = document.createElement('button');
  x.className = 't-x'; x.textContent = '✕'; x.setAttribute('aria-label', '关闭');
  x.addEventListener('click', () => el.remove());
  el.appendChild(x);
  host.appendChild(el);
  setTimeout(() => el.remove(), 5200);
}

/* ── 总渲染 ───────────────────────────────────────────────────────────────── */
function refresh() {
  document.getElementById('rail-count').textContent = String(state.notes.length);
  if (state.main === 'notes') renderNotes();
  else renderConversation();
  renderHover();
  railNotes.setAttribute('aria-current', String(state.main === 'notes'));
}
function render() { applyEntryPositions(); refresh(); }

function applyEntryPositions() {
  const sidebar = document.getElementById('rail-notes');
  if (sidebar) sidebar.style.display = state.entryPositions.includes('sidebar') ? '' : 'none';
  const header = document.getElementById('hdr-notes');
  if (header) header.style.display = state.entryPositions.includes('header') ? '' : 'none';
}

document.getElementById('d-theme').addEventListener('click', () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
});
document.getElementById('d-hover').addEventListener('click', () => {
  if (hoverEl.dataset.open === 'true') { hideHover(); return; }
  railNotes.setAttribute('aria-expanded', 'true');
  showHover();
});
document.getElementById('d-notes').addEventListener('click', () => {
  hideHover(); state.main = 'notes'; render();
});
document.getElementById('d-sheet').addEventListener('click', () => { openSheet(); });
document.getElementById('d-reset').addEventListener('click', () => {
  state.notes = structuredClone(SEED);
  state.savedHashes = new Set(state.notes.map((n) => hash(n.text)));
  state.query = ''; state.editing = null; state.main = 'conversation';
  refresh();
});

/* 截图/演示用深链：#notes 详情页、#hover 浮层、#edit 编辑态、#dark 深色、#flat 平铺 */
const hashSet = new Set(location.hash.replace(/^#/, '').split(',').filter(Boolean));
if (hashSet.has('notes')) state.main = 'notes';
if (hashSet.has('edit')) { state.main = 'notes'; state.editing = 'n1'; }
if (hashSet.has('dark')) document.documentElement.dataset.theme = 'dark';
if (hashSet.has('flat') || hashSet.has('notes')) { state.main = 'notes'; if (hashSet.has('flat')) state.view = 'flat'; }

renderSidebar();
railNotes.setAttribute('aria-expanded', 'false');
refresh();

if (hashSet.has('hover')) {
  document.documentElement.dataset.noanim = 'true';
  showHover();
  hoverEl.dataset.open = 'true';
}
if (hashSet.has('sheet')) {
  state.main = 'notes';
  refresh();
  openSheet();
}
</script>
</body>
</html>
