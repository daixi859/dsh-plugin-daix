# Agent preset lite：文件操作 / 命令执行 / 网络 / ask_user_question / skill，
# 外加 agent-instructions（加载 ~/.dsh/AGENTS.md 与项目内各级 AGENTS.md / CLAUDE.md）。
# 基座服务（ctx.fs、ctx.subprocess、web、skills、attachments）由部署层提供，
# 这里只挂工具行；用 plugin_manager 安装本 bundle 后，新会话即可在模式选择器中选择。
- insert:
    - id: preset-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lite
        name: 精简
        description: 仅文件操作、命令执行、网络、提问与技能工具，含 AGENTS.md 工作区指令。
        order: 5
        plugins:
          # 身份提示词，不注册任何模型可见工具。
          # prefix/suffix 是模板，渲染时严格对照已注册的 prompt 变量解析，
          # 只有 provider 和 model 可用（dsh-agent-loop 注册）；工作目录由
          # 运行时上下文作为必需项自动注入，写 {{cwd}} 会导致整轮渲染失败。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          # 工作区指令：加载 ~/.dsh/AGENTS.md 与项目内各级 AGENTS.md / CLAUDE.md（64 KiB 渲染预算）
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # 命令执行：按平台启用 bash / pwsh
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # 文件操作：read / write / edit / read_image
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          # 文件操作：glob / grep
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # 网络：web_search / web_fetch
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # 提问：ask_user_question
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 技能：技能目录来源 + skill 工具
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
